<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Signin</title>

    <!-- CSS読み込み -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- JS読み込み -->
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}" defer></script>
    <script th:src="@{/js/color-modes.js}" defer></script>
    <!-- Custom styles for this template -->
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <link th:href="@{/css/admin/account.css}" rel="stylesheet">

</head>
<body>

<header th:replace="admin/admin-header"></header>

<main >
    <div id='form-import' class="card">
        <div class="card-header">口座登録</div>
        <div class="card-body">
            <form method="post" th:action="@{/import-account}" th:object="${importAccountForm}">
                <div class="input-group mb-3">
                    <input class="form-control" type="file" id="formFileMultiple" multiple required>
                    <button class="btn btn-outline-primary" type="submit" id="button-import">実行</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>

</body>
</html>
