<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Signin</title>

    <!-- CSS読み込み -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- JS読み込み -->
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}" defer></script>
    <!-- Custom styles for this template -->
    <link th:href="@{/css/sign/sign.css}" rel="stylesheet">
    <link th:href="@{/css/sign/sign-in.css}" rel="stylesheet">

</head>

<body>

<header th:replace="sign/sign-header"></header>

<main class="form-signin w-100 m-auto">
    <form method="post" th:action="@{/sign-in}" th:object="${signInForm}">
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

        <div class="form-floating">
            <input type="text" class="form-control" id="floatingInput" placeholder="会社CD" th:field="*{companyCd}" required>
            <label for="floatingInput">会社CD</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password" th:field="*{passwd}" required>
            <label for="floatingPassword">Password</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-unlock" viewBox="0 0 16 16">
                <path d="M11 1a2 2 0 0 0-2 2v4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h5V3a3 3 0 0 1 6 0v4a.5.5 0 0 1-1 0V3a2 2 0 0 0-2-2M3 8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1z"/>
            </svg>
            Sign in
        </button>
    </form>
    <a id="forget-link" href="#">パスワードを忘れた場合</a>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>

</body>
</html>
